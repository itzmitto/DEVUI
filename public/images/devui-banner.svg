<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title description">
<title id="title">DevUI Code Library</title><desc id="description">A dark violet banner with the DevUI code symbol, a gradient button, a code snippet and a glowing chart.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0c0b13"/><stop offset="1" stop-color="#151021"/></linearGradient>
 <radialGradient id="haze"><stop stop-color="#7532d9" stop-opacity=".4"/><stop offset="1" stop-color="#7532d9" stop-opacity="0"/></radialGradient>
 <linearGradient id="purple" x2="1" y2="1"><stop stop-color="#dba8ff"/><stop offset=".5" stop-color="#a85dff"/><stop offset="1" stop-color="#6240e9"/></linearGradient>
 <linearGradient id="panel" x2="0" y2="1"><stop stop-color="#242031"/><stop offset="1" stop-color="#121018"/></linearGradient>
 <linearGradient id="area" x2="0" y2="1"><stop stop-color="#ac73ff" stop-opacity=".5"/><stop offset="1" stop-color="#ac73ff" stop-opacity="0"/></linearGradient>
 <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#b9a5d8" opacity=".16"/></pattern>
</defs>
<rect x=".5" y=".5" width="1279" height="399" rx="24" fill="url(#bg)" stroke="#322541"/>
<rect x="1" y="1" width="1278" height="398" rx="24" fill="url(#dots)"/>
<ellipse cx="1000" cy="205" rx="430" ry="310" fill="url(#haze)"/>
<g fill="none" stroke="#9670cb" opacity=".15"><circle cx="1014" cy="218" r="188"/><circle cx="1014" cy="218" r="255"/><path d="M670 400 1050 0M825 400 1205 0"/></g>
<g font-family="Arial, Helvetica, sans-serif">
 <rect x="60" y="53" width="150" height="26" rx="13" fill="#20172d" stroke="#63417e"/>
 <circle cx="75" cy="66" r="3" fill="#bd85ff"/><text x="87" y="70" fill="#d6b8f3" font-size="10" letter-spacing="2">CODE LIBRARY</text>
 <path d="m85 124-25 25 25 25m35-50 25 25-25 25" fill="none" stroke="url(#purple)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
 <text x="164" y="180" fill="#faf6ff" font-size="78" font-weight="700" letter-spacing="-4">Dev<tspan fill="#bd84ff">UI</tspan></text>
 <text x="60" y="235" fill="#f0e5ff" font-size="25" font-weight="500" letter-spacing="-.4">Kleine componenten. Grote ideeën.</text>
 <text x="60" y="269" fill="#a69ab7" font-size="16">Ontdek, kopieer en bouw je eigen interface.</text>
 <g font-size="11" fill="#c7b6dd" letter-spacing="1.3"><text x="60" y="336">REACT</text><text x="143" y="336" fill="#5b456d">/</text><text x="165" y="336">TYPESCRIPT</text><text x="292" y="336" fill="#5b456d">/</text><text x="314" y="336">TAILWIND CSS</text></g>
 <g transform="translate(760 50) rotate(-5 200 105)">
  <rect width="360" height="168" rx="15" fill="url(#panel)" stroke="#67438d"/>
  <path d="M0 37H360" stroke="#3c2a4e"/>
  <circle cx="18" cy="19" r="4" fill="#f7789f"/><circle cx="33" cy="19" r="4" fill="#e8bd62"/><circle cx="48" cy="19" r="4" fill="#7bd0a0"/>
  <text x="263" y="23" font-size="10" fill="#9588aa" font-family="monospace">Button.tsx</text>
  <g font-family="monospace" font-size="14"><text x="23" y="70" fill="#c999ec">&lt;button</text><text x="38" y="96" fill="#bcabda">className=<tspan fill="#84d8b3">"your-style"</tspan></text><text x="38" y="122" fill="#f6eaff">Build something cool</text><text x="23" y="148" fill="#c999ec">&lt;/button&gt;</text></g>
 </g>
 <g transform="translate(715 235)">
  <rect width="252" height="71" rx="35.5" fill="url(#purple)"/>
  <rect x="1" y="1" width="250" height="69" rx="34.5" fill="none" stroke="#f2d1ff" stroke-opacity=".3"/>
  <text x="32" y="43" font-size="17" font-weight="600" fill="white">Get started</text><path d="M196 36h21m-7-7 7 7-7 7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
 </g>
 <g transform="translate(1000 214) rotate(5 100 64)">
  <rect width="212" height="131" rx="17" fill="#16121e" stroke="#644280"/>
  <text x="20" y="28" fill="#ad9bbf" font-size="10" letter-spacing="1.4">YOUR NEXT IDEA</text><text x="20" y="57" fill="#f4eafa" font-size="23" font-weight="600">Made to build.</text>
  <path d="M20 108V100L49 89 73 96 103 77 128 84 155 69 190 72V117H20Z" fill="url(#area)"/>
  <path d="m20 100 29-11 24 7 30-19 25 7 27-15 35 3" fill="none" stroke="#b286ff" stroke-width="2"/>
  <circle cx="155" cy="69" r="3" fill="#d9b6ff"/>
 </g>
</g>
</svg>